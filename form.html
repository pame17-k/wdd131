<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Build an HTML form with a confirmation page that meets the specified requirements. ">
    <meta name="author" content="Pamela Beltran Tujillo">

    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <!--Product Name-->
            <label for="productName">Product Name:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a product...</option>
                <!--Options will be added dynamically-->
            </select>

            <!--Overall Rating agregue el id-->
            <fieldset class="rating">
                <legend>Overall Rating:</legend>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">★</label>

                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">★★</label>

                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">★★★</label>

                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">★★★★</label>

                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">★★★★★</label>
            </fieldset>

            <!--Date of Installation-->
            <label for="installDate">Date of Installation: </label>
            <input type="date" id="installDate" name="installDate" required>

            <!--Useful Features-->
            <fieldset>
                <legend>Useful Features:</legend>
                <input type="checkbox" id="features1" name="features" value="Durability">
                <label for="features1">Durability</label>

                <input type="checkbox" id="features2" name="features" value="Ease of Use">
                <label for="features2">Ease of Use</label>

                <input type="checkbox" id="features3" name="features" value="Performance">
                <label for="features3">Performance</label>

                <input type="checkbox" id="features4" name="features" value="Design">
                <label for="features4">Design</label>
            </fieldset>

            <!--Written Review-->
            <label for="reviewText">Written Review: </label>
            <textarea id="reviewText" name="reviewText"></textarea>

            <!--User Name-->
            <label for="userName">User Name: </label>
            <input type="text" id="userName" name="userName">

            <!--Submission Button-->
            <input type="submit" value="Post">

        </form>
    </main>
    <footer>
        <p>
            &copy; <span id="year"></span> Pamela Beltran Trujillo - Mexico
        </p>
        <p>
            <span id="lastModified"></span>
        </p>
    </footer>
    
</body>
</html>
